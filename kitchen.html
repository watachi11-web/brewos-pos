<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display — BrewOS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:#143D2B; --green2:#1E5A3F;
  --bg:#F7E9D6; --card:#ffffff; --border:#e8e2d6;
  --text:#1a2e1a; --muted:#6b7d68;
  --pending:#F26C21; --pending-bg:#FFF7ED;
  --making:#3B82F6; --making-bg:#EFF6FF;
  --done:#16A34A; --done-bg:#F0FDF4;
  --hh:#FB923C; --bb:#52B788;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; font-family:'Anuphan','Poppins',sans-serif; background:#1a2e1a; color:#fff; overflow:hidden; }

body { display:flex; flex-direction:column; }
.action-btn:disabled { opacity:.4; cursor:wait; }
.kds-header { background:#111; padding:12px 20px; display:flex; align-items:center; gap:16px; border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0; }
.kds-logo { font-family:'Poppins',sans-serif; font-size:15px; color:#fff; }
.kds-brand-tabs { display:flex; gap:4px; }
.kds-tab { padding:5px 16px; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; background:rgba(255,255,255,0.08); border:none; color:rgba(255,255,255,0.5); font-family:'Anuphan','Poppins',sans-serif; transition:all 0.15s; }
.kds-tab.active { background:var(--green2); color:#fff; }
.kds-stats { margin-left:auto; display:flex; gap:20px; }
.kds-stat { text-align:center; }
.kds-stat-val { font-size:18px; font-weight:700; line-height:1; }
.kds-stat-lbl { font-size:9px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
.kds-time { font-size:13px; color:rgba(255,255,255,0.5); }
.kds-refresh { padding:6px 14px; border-radius:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); font-size:12px; cursor:pointer; font-family:'Anuphan','Poppins',sans-serif; transition:all 0.15s; }
.kds-refresh:hover { background:rgba(255,255,255,0.15); color:#fff; }

.kds-notice { background:rgba(249,115,22,0.12); border-bottom:1px solid rgba(249,115,22,0.25); padding:6px 20px; font-size:11px; color:#FDB98B; flex-shrink:0; }

.kds-body { flex:1; display:flex; overflow:hidden; min-height:0; }

.kds-col { flex:1; display:flex; flex-direction:column; overflow:hidden; border-right:1px solid rgba(255,255,255,0.06); }
.kds-col:last-child { border-right:none; }
.kds-col-header { padding:10px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.kds-col-dot { width:8px; height:8px; border-radius:50%; }
.kds-col-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; }
.kds-col-count { font-size:10px; color:rgba(255,255,255,0.4); margin-left:auto; }
.kds-col-body { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:8px; }
.kds-col-body::-webkit-scrollbar { width:4px; }
.kds-col-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }

.order-card { background:rgba(255,255,255,0.06); border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.08); transition:all 0.2s; }
.order-card:hover { background:rgba(255,255,255,0.09); }
.order-card-header { padding:10px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,0.06); }
.order-id { font-size:12px; font-weight:700; color:#fff; flex:1; }
.order-table { font-size:10px; color:rgba(255,255,255,0.5); }
.brand-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.order-items { padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
.order-item { display:flex; align-items:flex-start; gap:8px; }
.item-qty { font-size:14px; font-weight:700; color:#fff; min-width:20px; line-height:1.2; }
.item-name { font-size:12px; font-weight:500; color:rgba(255,255,255,0.85); line-height:1.3; flex:1; }
.order-card-footer { padding:8px 14px; display:flex; gap:6px; border-top:1px solid rgba(255,255,255,0.06); }
.action-btn { flex:1; padding:7px; border-radius:7px; font-size:11px; font-weight:600; cursor:pointer; border:none; font-family:'Anuphan','Poppins',sans-serif; transition:all 0.15s; }
.btn-start  { background:rgba(59,130,246,0.2); color:#93C5FD; border:1px solid rgba(59,130,246,0.3); }
.btn-start:hover  { background:rgba(59,130,246,0.35); }
.btn-done   { background:rgba(22,163,74,0.2); color:#86EFAC; border:1px solid rgba(22,163,74,0.3); }
.btn-done:hover   { background:rgba(22,163,74,0.35); }
.btn-recall { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.1); }
.btn-recall:hover { background:rgba(255,255,255,0.12); }

.timer { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
.timer-ok     { background:rgba(22,163,74,0.2); color:#86EFAC; }
.timer-warn   { background:rgba(249,115,22,0.2); color:#FDB98B; }
.timer-urgent { background:rgba(220,38,38,0.25); color:#FCA5A5; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.empty-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; opacity:0.25; font-size:13px; }
</style>
<link rel="stylesheet" href="navigation.css?v=1">
</head>
<body>

<div class="kds-header">
  <a class="brewos-home-link" href="dashboard.html">← หน้าหลัก</a>
  <div class="kds-logo"><img src="logo-hh-icon.png" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px" onerror="this.style.display='none'"> Kitchen Display / จอครัว</div>
  <div class="kds-brand-tabs">
    <button class="kds-tab active" onclick="switchBrand('ALL',this)">All / ทั้งหมด</button>
    <button class="kds-tab" onclick="switchBrand('BB',this)">Brain Brew</button>
    <button class="kds-tab" onclick="switchBrand('HH',this)">Heng Heng</button>
  </div>
  <div class="kds-stats">
    <div class="kds-stat"><div class="kds-stat-val" id="stat-pending">0</div><div class="kds-stat-lbl">Pending / รอทำ</div></div>
    <div class="kds-stat"><div class="kds-stat-val" id="stat-making">0</div><div class="kds-stat-lbl">Making / กำลังทำ</div></div>
    <div class="kds-stat"><div class="kds-stat-val" id="stat-done-today">0</div><div class="kds-stat-lbl">Ready / พร้อมเสิร์ฟ</div></div>
  </div>
  <div class="kds-time" id="kds-clock">--:--</div>
  <button class="kds-refresh" onclick="loadOrders()">⟳ Refresh</button>
</div>

<div class="kds-notice" role="status" id="sync-notice">กำลังเชื่อมต่อสถานะครัว...</div>
<div style="padding:6px 20px;display:flex;gap:12px;align-items:center"><label>วันที่ <input type="date" id="queue-date"></label><span id="cancelled-notice"></span><button class="kds-refresh" id="retry-kitchen" hidden>ตรวจและส่งสถานะเดิมอีกครั้ง</button></div>

<div class="kds-body">
  <div class="kds-col">
    <div class="kds-col-header">
      <div class="kds-col-dot" style="background:var(--pending)"></div>
      <div class="kds-col-title" style="color:var(--pending)">New Orders / ออเดอร์ใหม่</div>
      <div class="kds-col-count" id="count-pending">0</div>
    </div>
    <div class="kds-col-body" id="col-pending"></div>
  </div>
  <div class="kds-col">
    <div class="kds-col-header">
      <div class="kds-col-dot" style="background:var(--making)"></div>
      <div class="kds-col-title" style="color:var(--making)">In Progress / กำลังทำ</div>
      <div class="kds-col-count" id="count-making">0</div>
    </div>
    <div class="kds-col-body" id="col-making"></div>
  </div>
  <div class="kds-col">
    <div class="kds-col-header">
      <div class="kds-col-dot" style="background:var(--done)"></div>
      <div class="kds-col-title" style="color:var(--done)">Ready / พร้อมเสิร์ฟ</div>
      <div class="kds-col-count" id="count-done">0</div>
    </div>
    <div class="kds-col-body" id="col-done"></div>
  </div>
</div>

<script src="ui-safe.js?v=1"></script>
<script src="api.js"></script>
<script>
const kitchenState = {};
let ACTIVE_BRAND = 'ALL', ALL_ORDERS = [], loading = false, saving = false, synced = false, lastUpdateError = '';
const PENDING_KEY = 'brewos_kitchen_pending_v1';
let pendingUpdate = null;
try { pendingUpdate = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); } catch(e) { pendingUpdate = {invalid:true}; }
function notice(text) { document.getElementById('sync-notice').textContent = text; }
function updateControls() {
 document.querySelectorAll('[data-next-status]').forEach(b=>b.disabled=saving||loading||!synced||!!pendingUpdate);
 document.getElementById('retry-kitchen').hidden=!pendingUpdate;
 document.getElementById('retry-kitchen').disabled=saving||!!pendingUpdate?.invalid;
}

function dateKeyBkk(val) {
  const d = new Date(val);
  if (isNaN(d.getTime())) return '';
  const bkk = new Date(d.toLocaleString('en-US', {timeZone:'Asia/Bangkok'}));
  return `${bkk.getFullYear()}-${String(bkk.getMonth()+1).padStart(2,'0')}-${String(bkk.getDate()).padStart(2,'0')}`;
}

function timeDiffMinutes(createdAt) {
  const d = new Date(createdAt);
  if (isNaN(d.getTime())) return 0;
  return Math.floor((Date.now() - d.getTime()) / 60000);
}
function timeLabel(mins) { return mins < 60 ? `${mins}m` : `${Math.floor(mins/60)}h ${mins%60}m`; }
function timerClass(mins) { return mins < 10 ? 'timer-ok' : mins < 20 ? 'timer-warn' : 'timer-urgent'; }

async function loadOrders() {
  if(loading||saving)return;
  loading=true;updateControls();
  const date=document.getElementById('queue-date').value;
  try {
    const queue=await apiGet('get_kitchen_queue',{date});
    if(document.getElementById('queue-date').value!==date){loading=false;return loadOrders();}
    if(!queue||!Array.isArray(queue.orders))throw Error('รูปแบบข้อมูลครัวไม่ถูกต้อง');
    ALL_ORDERS=queue.orders;
    ALL_ORDERS.forEach(o=>kitchenState[o.order_id]=o.preparation_status);
    synced=true;
    notice(lastUpdateError || (pendingUpdate?'มีการเปลี่ยนสถานะรอตรวจผล กดตรวจและส่งสถานะเดิมอีกครั้ง':'บันทึกสถานะที่ระบบแล้ว • ซิงก์ทุก 15 วินาที • ล่าสุด '+new Date().toLocaleTimeString('th-TH')));
  } catch(e) {
    synced=false;notice('ซิงก์ไม่สำเร็จ — ข้อมูลที่แสดงอาจเก่า: '+e.message);
  } finally { loading=false;renderAll();updateControls(); }
}

function getDisplayOrders() {
  return ALL_ORDERS.filter(o => ACTIVE_BRAND === 'ALL' || o.brand_id === ACTIVE_BRAND);
}

function renderAll() {
  const orders = getDisplayOrders();
  const cancelled=orders.filter(o=>kitchenState[o.order_id]==='cancelled');
  document.getElementById('cancelled-notice').textContent=cancelled.length?'ยกเลิกแล้ว '+cancelled.map(o=>String(o.order_id).slice(-8)).join(', '):'';
  const pending = orders.filter(o => kitchenState[o.order_id] === 'pending');
  const making  = orders.filter(o => kitchenState[o.order_id] === 'making');
  const done    = orders.filter(o => kitchenState[o.order_id] === 'done');

  document.getElementById('count-pending').textContent = pending.length;
  document.getElementById('count-making').textContent  = making.length;
  document.getElementById('count-done').textContent    = done.length;
  document.getElementById('stat-pending').textContent    = pending.length;
  document.getElementById('stat-making').textContent     = making.length;
  document.getElementById('stat-done-today').textContent = done.length;

  document.getElementById('col-pending').innerHTML = pending.length
    ? pending.map(o => renderCard(o, 'pending')).join('')
    : `<div class="empty-col"><div style="font-size:28px">✅</div><div>No pending orders / ไม่มีออเดอร์รอทำ</div></div>`;
  document.getElementById('col-making').innerHTML = making.length
    ? making.map(o => renderCard(o, 'making')).join('')
    : `<div class="empty-col"><div style="font-size:28px">👨‍🍳</div><div>Nothing in progress / ไม่มีรายการกำลังทำ</div></div>`;
  document.getElementById('col-done').innerHTML = done.length
    ? done.map(o => renderCard(o, 'done')).join('')
    : `<div class="empty-col"><div style="font-size:28px">🍽</div><div>No ready orders / ไม่มีรายการพร้อมเสิร์ฟ</div></div>`;
}

function renderCard(o, status) {
  const orderId = o.order_id || '—';
  const brandColor = (o.brand_id === 'HH') ? 'var(--hh)' : 'var(--bb)';
  const tableLabel = o.table_number ? `🪑 ${o.table_number}` : '';
  const custLabel  = o.customer_name && o.customer_name !== 'Walk-in' ? o.customer_name : 'Walk-in';
  const mins = timeDiffMinutes(o.created_at);
  const shortId = String(orderId).slice(-8);

  const items = Array.isArray(o.items) ? o.items : [];
  const itemsHtml = items.length
    ? items.map(i => `<div class="order-item"><div class="item-qty">${BrewUI.html(i.qty)}×</div><div class="item-name">${BrewUI.html(i.name)}${i.modifiers?.length?'<br>'+i.modifiers.map(BrewUI.html).join(', '):''}${i.notes?'<br>'+BrewUI.html(i.notes):''}</div></div>`).join('')
    : `<div class="order-item"><div class="item-name" style="color:rgba(255,255,255,0.4)">— item details not available / ไม่มีรายละเอียดสินค้า —</div></div>`;

  const footerBtns = status === 'pending'
    ? `<button class="action-btn btn-start" data-order-id="${BrewUI.html(orderId)}" data-next-status="making">▶ Start / เริ่มทำ</button>`
    : status === 'making'
    ? `<button class="action-btn btn-recall" data-order-id="${BrewUI.html(orderId)}" data-next-status="pending">↩ Recall / ย้อนกลับ</button>
       <button class="action-btn btn-done" data-order-id="${BrewUI.html(orderId)}" data-next-status="done">✓ Ready / เสร็จแล้ว</button>`
    : `<button class="action-btn btn-recall" data-order-id="${BrewUI.html(orderId)}" data-next-status="making">↩ Reopen / เปิดใหม่</button>`;

  return `
    <div class="order-card" id="card-${BrewUI.html(orderId)}">
      <div class="order-card-header">
        <div class="brand-dot" style="background:${brandColor}"></div>
        <div class="order-id">${BrewUI.html(shortId)}</div>
        ${tableLabel ? `<div class="order-table">${BrewUI.html(tableLabel)}</div>` : ''}
        <span class="timer ${timerClass(mins)}">${timeLabel(mins)}</span>
      </div>
      <div style="padding:4px 14px 0;font-size:10px;color:rgba(255,255,255,0.4)">${BrewUI.html(custLabel)}</div>
      <div class="order-items">${itemsHtml}${o.notes?'<div>หมายเหตุ: '+BrewUI.html(o.notes)+'</div>':''}</div>
      <div class="order-card-footer">${footerBtns}</div>
    </div>`;
}

document.addEventListener('click',event=>{const button=event.target.closest('[data-order-id][data-next-status]');if(button&&['pending','making','done'].includes(button.dataset.nextStatus))moveOrder(button.dataset.orderId,button.dataset.nextStatus);});
async function moveOrder(orderId,newStatus) {
 if(saving||loading||!synced||pendingUpdate)return;
 const o=ALL_ORDERS.find(o=>o.order_id===orderId);if(!o)return;
 const request={operation_id:'KDS-'+crypto.randomUUID(),order_id:orderId,status:newStatus,expected_version:o.preparation_version};
 try{localStorage.setItem(PENDING_KEY,JSON.stringify(request));}catch(e){notice('บันทึกรายการรอตรวจไม่ได้ กรุณาเปิดพื้นที่จัดเก็บของเบราว์เซอร์');return;}
 pendingUpdate=request;await sendKitchenUpdate();
}
async function sendKitchenUpdate(){
 if(saving||!pendingUpdate||pendingUpdate.invalid)return;
 saving=true;lastUpdateError='';updateControls();notice('กำลังบันทึกสถานะ...');
 try{
  const result=await apiPost('update_kitchen_status',pendingUpdate);
  if(!result?.saved)throw Error('ยังยืนยันผลบันทึกไม่ได้');
  localStorage.removeItem(PENDING_KEY);pendingUpdate=null;
 }catch(e){
  // Only these explicit pre-write rejections can safely release the pending request.
  if(/KITCHEN_STATE_CHANGED_REFRESH|KITCHEN_ORDER_CANCELLED|KITCHEN_ORDER_NOT_FOUND|INVALID_KITCHEN_TRANSITION|INVALID_KITCHEN_REQUEST/.test(e.message)){
   localStorage.removeItem(PENDING_KEY);pendingUpdate=null;
  }
  lastUpdateError='ตรวจผลการเปลี่ยนสถานะ: '+e.message+(pendingUpdate?' — กดตรวจและส่งสถานะเดิมอีกครั้ง':' — โหลดสถานะล่าสุดแล้ว กรุณาตรวจบิลก่อนกดใหม่');notice(lastUpdateError);
 }finally{saving=false;synced=false;updateControls();}
 await loadOrders();
}
document.getElementById('retry-kitchen').addEventListener('click',sendKitchenUpdate);
document.getElementById('queue-date').value=dateKeyBkk(new Date());
document.getElementById('queue-date').addEventListener('change',loadOrders);
function switchBrand(brand, btn) {
  ACTIVE_BRAND = brand;
  document.querySelectorAll('.kds-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();updateControls();
}

function updateClock() {
  document.getElementById('kds-clock').textContent = new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Bangkok'});
}

setInterval(loadOrders, 15000);
setInterval(updateClock, 1000);
updateClock();
loadOrders();
</script>
</body>
