name: QA authored independent E-04 2026-11-15
on:
  push:
    branches: [qa/independent-e04-20261115]
    paths:
      - tools/qa/qa-e04-independent.cjs
      - .github/workflows/qa-e04-independent.yml
permissions:
  contents: read
jobs:
  independent-e04:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/independent-e04" playwright@1.56.1
          "$RUNNER_TEMP/independent-e04/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run QA authored test against synthetic staging
        env:
          NODE_PATH: ${{ runner.temp }}/independent-e04/node_modules
          QA_OUTPUT: evidence
        run: node tools/qa/qa-e04-independent.cjs
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-independent-e04-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
